<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1220" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Kopernik</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%97%3C/text%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b1220;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      /* Three.js canvas fills the viewport; it sizes itself from #app. */
      #app {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      /* HTML/CSS UI overlay (HUD, menus, buttons) sits above the 3D canvas.
         Native DOM buttons = perfect touch hit-testing (no canvas coord math). */
      #ui {
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
      }
      /* Each overlay owns its OWN root pointer-events. Click-through HUD layers
         (.dr-hud / .dr-free / .dr-drive) set `none` on their root and opt their
         buttons back in with `auto`; full-screen interactive screens
         (.dr-modes / .dr-market / .dr-garage) set `auto`. Because `#ui` itself is
         `pointer-events: none`, any child that sets nothing inherits none and is
         click-through — so no blanket rule is needed here.
         DO NOT re-add a `#ui > * { pointer-events: … }` rule: its ID-level
         specificity (1,0,0) beats the component class rules (0,1,0) and forces
         EVERY overlay to one value — which made the whole mode-select/market/
         garage screens un-tappable. */
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #e6edf7;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        letter-spacing: 0.12em;
        font-weight: 700;
        text-transform: uppercase;
        z-index: 10;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <div id="loading">Kopernik…</div>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
